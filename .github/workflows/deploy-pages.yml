name: Deploy docs to GitHub Pages

# 改用 GitHub Actions 部署（原本「從分支部署」的舊建置管線會偶發失敗、每次都寄失敗信）。
# 只部署 docs/ 靜態檔；不碰 fetch.py / Telegram session / 本機排程，也不使用任何 secret。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 每小時的資料更新會連續觸發：只允許一個並行部署，排隊中的較舊 run 會被跳過，
# 但「進行中」的部署不取消 —— 中途砍掉 production 部署會讓 Pages deployment 卡半完成、
# 下一次就回 "Deployment failed, try again later"。這是 GitHub 官方 Pages 範本的設定。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # GitHub Pages 後端偶發回 "Deployment failed, try again later"（部署已建立、後端瞬間失敗）。
      # 同一次 run 內最多試 3 次；前兩次容錯，只有連 3 次都失敗才讓 workflow 真的失敗、寄信。
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # 三次都失敗 → 幾乎必為 GitHub Pages 後端偶發抖動（部署無害、下一小時的資料 push 會自動補上，
      # 舊版仍在線上）。此時「不」讓 workflow 判失敗（避免每小時寄一封失敗信），只留一個 ⚠️ 警告，
      # 在 Actions 分頁仍看得到。若你想恢復「失敗就寄信」，把下面的 exit 0 改成 exit 1 即可。
      - name: Report deploy result (do not fail the run on backend flakiness)
        if: always()
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "success" ] || \
             [ "${{ steps.deploy2.outcome }}" = "success" ] || \
             [ "${{ steps.deploy3.outcome }}" = "success" ]; then
            echo "✅ Pages 部署成功。"
          else
            echo "::warning::Pages 部署三次皆失敗（GitHub Pages 後端偶發問題）。線上維持上一個成功版，下次資料 push 會再嘗試。刻意不判為失敗，避免每小時寄失敗信。"
          fi
          exit 0
