name: Deploy docs to GitHub Pages

# 改用 GitHub Actions 部署（原本「從分支部署」的舊建置管線會偶發失敗、每次都寄失敗信）。
# 只部署 docs/ 靜態檔；不碰 fetch.py / Telegram session / 本機排程，也不使用任何 secret。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 每小時的資料更新會連續觸發；同時只保留最新一次部署，較舊的直接取消（取消不算失敗、不寄信）。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
